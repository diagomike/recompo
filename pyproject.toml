[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "recomp"
version = "0.1.0"
description = "Recomposer: an agent-operated studio for cutting, composing, dubbing and sharing media recipes"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.8",
  "httpx>=0.27",
  "yt-dlp[default,curl-cffi]",
  "edge-tts>=7.3.1",
  "segno>=1.6",
  "mcp>=2.3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
recomp = "recomp.cli:main"

[tool.setuptools.packages.find]
include = ["recomp*", "hub*"]

[tool.setuptools.package-data]
recomp = ["agent_kit/**/*", "agent_kit/**/.*", "agent_kit/.claude/skills/*/*", "render/fonts/*", "static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "e2e: end-to-end tests over generated media (slower)",
  "real: tests that need real media or network (skipped by default)",
]
addopts = "-m 'not real'"
